plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.4.1'
group = 'com.agony'
base { archivesName = 'agony' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.2'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                agony { source sourceSets.main }
            }
        }
    }
}

// Garante que o exemplo do MDK (com.example, @Mod("examplemod")) nunca entre no JAR.
sourceSets.main.java { exclude 'com/example/**' }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.2-48.1.0'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : 'agony',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version
        ])
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar.finalizedBy('reobfJar')
